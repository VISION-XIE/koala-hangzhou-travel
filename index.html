<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Koala杭州漫游地图 · 软萌攻略</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  :root {
    --sky-50:#f0f9ff; --sky-100:#e0f2fe; --sky-200:#bae6fd; --sky-300:#7dd3fc;
    --sky-400:#38bdf8; --sky-500:#0ea5e9; --sky-600:#0284c7;
    --pink-200:#fbcfe8; --pink-300:#f9a8d4; --pink-400:#f472b6; --pink-500:#ec4899;
    --mint-200:#bbf7d0; --mint-300:#6ee7b7;
    --amber-300:#fcd34d; --amber-500:#f59e0b;
    --text:#334155; --muted:#64748b;
    --radius:24px; --radius-sm:14px;
    --shadow-soft:0 10px 30px -8px rgba(14,165,233,.25);
    --shadow-pop:0 18px 40px -12px rgba(14,165,233,.45);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%;font-family:"Quicksand","PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:var(--text);
    background:radial-gradient(1200px 600px at 15% -10%,#e0f2fe 0%,transparent 60%),radial-gradient(1000px 500px at 110% 10%,#fbcfe8 0%,transparent 55%),linear-gradient(160deg,var(--sky-50) 0%,var(--sky-100) 50%,#f0fdfa 100%);overflow:hidden}
  .font-cute{font-family:"ZCOOL KuaiLe","PingFang SC",sans-serif}

  /* 背景云朵 */
  .cloud{position:fixed;pointer-events:none;opacity:.85;z-index:0;filter:drop-shadow(0 6px 10px rgba(14,165,233,.12));animation:drift linear infinite}
  .cloud svg{display:block;width:100%;height:100%}
  @keyframes drift{from{transform:translateX(-20vw)}to{transform:translateX(120vw)}}
  .cloud.c1{top:6%;width:140px;height:70px;animation-duration:55s}
  .cloud.c2{top:14%;width:90px;height:45px;animation-duration:70s;animation-delay:-20s;opacity:.7}
  .cloud.c3{bottom:8%;width:110px;height:55px;animation-duration:80s;animation-delay:-40s;opacity:.6}

  .app{position:relative;z-index:1;height:100vh;display:flex;flex-direction:column;padding:14px 18px 16px;gap:10px}

  /* 顶栏 */
  header.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;animation:fadeDown .7s cubic-bezier(.2,.8,.2,1) both}
  @keyframes fadeDown{from{opacity:0;transform:translateY(-16px)}to{opacity:1;transform:translateY(0)}}
  .brand{display:flex;align-items:center;gap:12px}
  .brand-logo{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,var(--sky-300),var(--sky-500));display:grid;place-items:center;box-shadow:0 8px 20px -6px rgba(14,165,233,.5);flex-shrink:0;position:relative}
  .brand-logo .koala{position:absolute;font-size:20px;animation:koalaBounce 2.5s ease-in-out infinite}
  @keyframes koalaBounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
  .brand h1{margin:0;font-size:24px;letter-spacing:1px;color:var(--sky-600);text-shadow:0 2px 0 rgba(255,255,255,.6)}
  .brand .sub{margin:2px 0 0;font-size:12px;color:var(--muted);font-weight:500}
  .top-actions{display:flex;gap:8px;align-items:center}
  .btn{border:none;cursor:pointer;font-family:inherit;font-weight:600;border-radius:999px;padding:9px 16px;font-size:13px;display:inline-flex;align-items:center;gap:7px;transition:transform .18s,box-shadow .18s;background:linear-gradient(135deg,var(--sky-400),var(--sky-600));color:#fff;box-shadow:0 8px 18px -8px rgba(14,165,233,.6)}
  .btn:hover{transform:translateY(-2px);box-shadow:0 12px 24px -8px rgba(14,165,233,.7)}
  .btn.ghost{background:#fff;color:var(--sky-600);border:2px solid var(--sky-200);box-shadow:0 6px 16px -8px rgba(14,165,233,.4)}
  .btn.ghost:hover{border-color:var(--sky-300)}
  .btn.danger{background:linear-gradient(135deg,#fda4af,#fb7185)}
  .btn.add{position:relative}
  .btn.add::after{content:"";position:absolute;inset:-4px;border-radius:999px;border:2px solid var(--sky-400);opacity:0;animation:pulseRing 2.4s ease-out infinite;pointer-events:none}
  @keyframes pulseRing{0%{opacity:.6;transform:scale(1)}100%{opacity:0;transform:scale(1.18)}}
  .stat-chip{background:rgba(255,255,255,.85);border:2px solid var(--sky-200);border-radius:999px;padding:5px 12px;font-size:12px;font-weight:600;color:var(--sky-600);display:inline-flex;align-items:center;gap:5px;box-shadow:0 6px 14px -8px rgba(14,165,233,.4)}

  /* 行程筛选 */
  .day-filter{display:flex;gap:7px;flex-wrap:wrap}
  .day-pill{border:2px solid #fff;background:rgba(255,255,255,.85);border-radius:999px;padding:5px 12px;font-size:12px;font-weight:600;cursor:pointer;transition:all .2s;display:inline-flex;align-items:center;gap:5px;box-shadow:0 4px 12px -6px rgba(14,165,233,.3);color:var(--muted)}
  .day-pill .dot{width:9px;height:9px;border-radius:50%;display:inline-block}
  .day-pill:hover{transform:translateY(-1px)}
  .day-pill.active{color:#fff;border-color:transparent;box-shadow:0 6px 16px -4px rgba(0,0,0,.2)}
  .day-pill[data-day="all"].active{background:linear-gradient(135deg,var(--sky-400),var(--sky-600))}
  .day-pill[data-day="1"].active{background:linear-gradient(135deg,var(--sky-300),var(--sky-500))}
  .day-pill[data-day="2"].active{background:linear-gradient(135deg,var(--pink-300),var(--pink-500))}
  .day-pill[data-day="3"].active{background:linear-gradient(135deg,var(--amber-300),var(--amber-500))}
  .day-pill[data-day="0"].active{background:linear-gradient(135deg,#cbd5e1,#94a3b8)}

  /* 天气条 */
  .weather-strip{display:flex;gap:10px}
  .weather-card{flex:1;background:rgba(255,255,255,.9);backdrop-filter:blur(8px);border:2px solid #fff;border-radius:16px;padding:8px 12px;display:flex;align-items:center;gap:10px;box-shadow:0 8px 22px -10px rgba(14,165,233,.3);transition:transform .2s}
  .weather-card:hover{transform:translateY(-2px)}
  .weather-card .wx-icon{width:44px;height:44px;flex-shrink:0;border-radius:12px;background:linear-gradient(135deg,var(--sky-100),var(--sky-200));display:grid;place-items:center;overflow:hidden}
  .weather-card .wx-date{font-size:11px;font-weight:700;color:var(--sky-600)}
  .weather-card .wx-desc{font-size:12px;font-weight:600;margin:1px 0}
  .weather-card .wx-temp{font-size:15px;font-weight:700;color:var(--sky-600)}
  .weather-card .wx-temp .lo{color:var(--muted);font-weight:500;font-size:12px}
  .weather-card .wx-rain{font-size:10px;color:var(--sky-500)}
  @keyframes wx-spin{to{transform:rotate(360deg)}}
  @keyframes wx-float{0%,100%{transform:translateX(0)}50%{transform:translateX(4px)}}
  @keyframes wx-rain{0%{transform:translateY(-4px);opacity:0}30%{opacity:1}100%{transform:translateY(10px);opacity:0}}
  @keyframes wx-bolt{0%,90%,100%{opacity:0}93%,97%{opacity:1}}
  .wx-sun-rays{transform-origin:32px 32px;animation:wx-spin 10s linear infinite}
  .wx-cloud-1{animation:wx-float 4s ease-in-out infinite}
  .wx-cloud-2{animation:wx-float 5s ease-in-out infinite reverse}
  .wx-drop{animation:wx-rain 1.2s linear infinite}
  .wx-bolt{animation:wx-bolt 2.5s ease-in-out infinite}

  /* 主区域 */
  .main{flex:1;display:flex;gap:12px;min-height:0}
  .map-wrap{flex:1;position:relative;border-radius:var(--radius);overflow:hidden;background:var(--sky-100);box-shadow:var(--shadow-pop);border:4px solid #fff;animation:mapReveal .9s cubic-bezier(.2,.8,.2,1) both;min-width:0}
  @keyframes mapReveal{from{opacity:0;transform:translateY(18px) scale(.985)}to{opacity:1;transform:translateY(0) scale(1)}}
  #map{width:100%;height:100%;background:var(--sky-100)}
  .leaflet-container{font-family:"Quicksand","PingFang SC",sans-serif;background:var(--sky-100)}
  .leaflet-control-zoom a{border-radius:14px!important;background:rgba(255,255,255,.92)!important;color:var(--sky-600)!important;border:2px solid var(--sky-200)!important;margin-bottom:6px!important;width:34px!important;height:34px!important;line-height:30px!important;font-size:16px!important;box-shadow:0 6px 14px -6px rgba(14,165,233,.4)}
  .leaflet-control-zoom a:hover{background:var(--sky-50)!important}
  .leaflet-bar{border:none!important;box-shadow:none!important;background:transparent!important}
  .leaflet-control-attribution{background:rgba(255,255,255,.7)!important;border-radius:10px 0 0 0!important;font-size:9px!important;padding:2px 6px!important}
  #map.add-mode{cursor:crosshair}

  /* 搜索 */
  .search-panel{position:absolute;top:14px;left:50%;transform:translateX(-50%);width:min(420px,calc(100% - 24px));z-index:600;display:none;animation:hintPop .4s cubic-bezier(.2,.8,.2,1)}
  .search-panel.show{display:block}
  .search-box{display:flex;align-items:center;background:rgba(255,255,255,.97);backdrop-filter:blur(8px);border:2px solid var(--sky-200);border-radius:999px;padding:5px 5px 5px 16px;box-shadow:0 12px 30px -10px rgba(14,165,233,.4)}
  .search-box input{flex:1;border:none;outline:none;font-family:inherit;font-size:13px;color:var(--text);background:transparent;padding:7px 4px}
  .search-box .search-btn{border:none;background:linear-gradient(135deg,var(--sky-400),var(--sky-600));color:#fff;width:32px;height:32px;border-radius:50%;cursor:pointer;display:grid;place-items:center;flex-shrink:0}
  .search-results{margin-top:8px;background:rgba(255,255,255,.98);backdrop-filter:blur(8px);border:2px solid var(--sky-100);border-radius:16px;overflow:hidden;box-shadow:0 12px 30px -10px rgba(14,165,233,.4);display:none;max-height:260px;overflow-y:auto}
  .search-results.show{display:block}
  .search-result{padding:9px 14px;cursor:pointer;border-bottom:1px solid var(--sky-50);transition:background .15s}
  .search-result:last-child{border-bottom:none}
  .search-result:hover{background:var(--sky-50)}
  .search-result .sr-name{font-size:13px;font-weight:600}
  .search-result .sr-addr{font-size:11px;color:var(--muted);margin-top:2px}
  .hint-banner{position:absolute;top:14px;left:50%;transform:translateX(-50%);background:rgba(255,255,255,.95);backdrop-filter:blur(8px);border:2px solid var(--pink-200);color:var(--text);padding:8px 16px;border-radius:999px;font-size:12px;font-weight:600;box-shadow:0 10px 24px -10px rgba(244,114,182,.5);z-index:500;display:none;align-items:center;gap:6px;animation:hintPop .4s cubic-bezier(.2,.8,.2,1)}
  .hint-banner.show{display:flex}
  @keyframes hintPop{from{opacity:0;transform:translate(-50%,-10px) scale(.95)}to{opacity:1;transform:translate(-50%,0) scale(1)}}

  /* 空状态 */
  .empty-state{position:absolute;inset:0;display:none;align-items:center;justify-content:center;pointer-events:none;z-index:400}
  .empty-state.show{display:flex}
  .empty-card{background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border:3px dashed var(--sky-300);border-radius:22px;padding:24px 30px;text-align:center;box-shadow:var(--shadow-soft);animation:floaty 4s ease-in-out infinite}
  @keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  .empty-card .big-emoji{font-size:42px;display:block;margin-bottom:6px}
  .empty-card .t{font-size:16px;color:var(--sky-600);font-weight:700}
  .empty-card .s{font-size:12px;color:var(--muted);margin-top:3px}

  /* 标记 */
  .cute-marker{width:36px;height:44px;transform-origin:50% 100%;animation:markerDrop .5s cubic-bezier(.34,1.56,.64,1) both;filter:drop-shadow(0 6px 6px rgba(0,0,0,.25))}
  @keyframes markerDrop{0%{transform:translateY(-50px) scale(.6) rotate(-12deg);opacity:0}60%{transform:translateY(5px) scale(1.05) rotate(4deg);opacity:1}100%{transform:translateY(0) scale(1) rotate(0);opacity:1}}
  .cute-marker:hover{transform:scale(1.12);transition:transform .15s}
  .cute-marker.checked-marker svg path{opacity:.45}
  .cute-marker.checked-marker{filter:grayscale(.5) drop-shadow(0 3px 4px rgba(0,0,0,.15))}

  /* 弹窗 */
  .leaflet-popup-content-wrapper{border-radius:18px!important;box-shadow:0 16px 40px -12px rgba(14,165,233,.4)!important;border:3px solid #fff!important;background:linear-gradient(160deg,#fff 0%,var(--sky-50) 100%)!important;padding:0!important;overflow:hidden}
  .leaflet-popup-content{margin:0!important;width:250px!important}
  .leaflet-popup-tip{background:#fff!important}
  .popup-head{color:#fff;padding:10px 14px;display:flex;align-items:center;gap:8px}
  .popup-head .emoji{font-size:20px}
  .popup-head .name{font-size:16px;font-weight:700;flex:1}
  .popup-head .day-tag{font-size:10px;font-weight:700;background:rgba(255,255,255,.3);padding:2px 8px;border-radius:999px}
  .popup-body{padding:12px 14px}
  .popup-body .label{font-size:10px;font-weight:700;color:var(--sky-500);text-transform:uppercase;letter-spacing:1px;margin-bottom:3px}
  .popup-body .notes{font-size:13px;line-height:1.6;white-space:pre-wrap;word-break:break-word;max-height:80px;overflow-y:auto}
  .popup-body .notes.empty{color:var(--muted);font-style:italic}
  .popup-meta{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin-top:8px;padding-top:8px;border-top:1px dashed var(--sky-200);flex-wrap:wrap;gap:4px}
  .popup-meta .transport{background:var(--sky-50);padding:2px 6px;border-radius:8px;color:var(--sky-600);font-weight:600}
  .popup-actions{display:flex;gap:6px;padding:0 14px 12px}
  .popup-actions .btn{flex:1;justify-content:center;padding:7px 8px;font-size:12px}
  .check-row{display:flex;align-items:center;gap:8px;padding:8px 14px 0}
  .check-row .check-label{font-size:13px;font-weight:600;color:var(--text)}

  /* 右侧面板 */
  .side-panel{width:380px;flex-shrink:0;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border:3px solid #fff;border-radius:var(--radius);box-shadow:var(--shadow-pop);display:flex;flex-direction:column;overflow:hidden;animation:mapReveal .9s .1s cubic-bezier(.2,.8,.2,1) both}
  .panel-tabs{display:flex;padding:8px 8px 0;gap:4px;flex-shrink:0}
  .panel-tab{flex:1;border:none;background:transparent;padding:9px 4px;font-family:inherit;font-size:12px;font-weight:700;color:var(--muted);cursor:pointer;border-radius:12px 12px 0 0;transition:all .2s;display:flex;flex-direction:column;align-items:center;gap:2px}
  .panel-tab .tab-emoji{font-size:16px}
  .panel-tab:hover{background:var(--sky-50)}
  .panel-tab.active{background:linear-gradient(135deg,var(--sky-100),#fff);color:var(--sky-600);box-shadow:0 -2px 8px -4px rgba(14,165,233,.2)}
  .panel-body{flex:1;overflow-y:auto;padding:14px}
  .panel-body::-webkit-scrollbar{width:6px}
  .panel-body::-webkit-scrollbar-thumb{background:var(--sky-200);border-radius:3px}
  .panel-section{display:none}
  .panel-section.active{display:block;animation:fadeIn .3s ease}
  @keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

  .section-title{font-size:15px;font-weight:700;color:var(--sky-600);margin:0 0 10px;display:flex;align-items:center;gap:6px}
  .section-title .count{font-size:11px;background:var(--sky-100);color:var(--sky-600);padding:2px 8px;border-radius:999px}

  /* 时间轴 */
  .day-group{margin-bottom:14px}
  .day-group-title{font-size:13px;font-weight:700;padding:6px 12px;border-radius:10px;display:inline-flex;align-items:center;gap:6px;margin-bottom:8px;color:#fff}
  .time-block{margin-bottom:8px;padding-left:8px;border-left:3px solid var(--sky-200)}
  .time-block-title{font-size:11px;font-weight:700;color:var(--muted);margin-bottom:5px;display:flex;align-items:center;gap:4px}
  .timeline-item{background:#fff;border:2px solid var(--sky-100);border-radius:12px;padding:9px 11px;margin-bottom:6px;display:flex;align-items:flex-start;gap:8px;transition:all .2s;cursor:pointer}
  .timeline-item:hover{border-color:var(--sky-300);transform:translateX(2px)}
  .timeline-item.checked{opacity:.55;background:var(--sky-50);border-color:var(--mint-200)}
  .timeline-item.checked .ti-name{text-decoration:line-through}
  .ti-check{width:20px;height:20px;border-radius:50%;border:2px solid var(--sky-300);flex-shrink:0;margin-top:1px;display:grid;place-items:center;cursor:pointer;transition:all .2s;background:#fff;font-size:12px}
  .ti-check.checked{background:linear-gradient(135deg,var(--mint-300),#34d399);border-color:#34d399;color:#fff}
  .ti-check.checked::after{content:"✓"}
  .ti-check.pop{animation:checkPop .5s cubic-bezier(.34,1.56,.64,1)}
  @keyframes checkPop{0%{transform:scale(1)}40%{transform:scale(1.4)}100%{transform:scale(1)}}
  .ti-info{flex:1;min-width:0}
  .ti-name{font-size:13px;font-weight:700;color:var(--text);display:flex;align-items:center;gap:5px}
  .ti-meta{font-size:11px;color:var(--muted);margin-top:2px;display:flex;flex-wrap:wrap;gap:6px}
  .ti-meta span{display:inline-flex;align-items:center;gap:2px}
  .ti-meta .dur{background:var(--amber-300);color:#92400e;padding:1px 6px;border-radius:6px;font-weight:600}
  .ti-meta .trans{background:var(--sky-100);color:var(--sky-600);padding:1px 6px;border-radius:6px;font-weight:600}
  .confetti{position:fixed;pointer-events:none;z-index:9999;font-size:20px;animation:confettiFall 1.2s ease-out forwards}
  @keyframes confettiFall{0%{transform:translateY(0) rotate(0);opacity:1}100%{transform:translateY(120px) rotate(360deg);opacity:0}}

  /* 美食 */
  .food-card{background:#fff;border:2px solid var(--pink-200);border-radius:14px;padding:11px 13px;margin-bottom:8px;transition:all .2s}
  .food-card:hover{box-shadow:0 6px 16px -6px rgba(244,114,182,.3);transform:translateY(-1px)}
  .food-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .food-name{font-size:14px;font-weight:700;color:var(--text)}
  .food-mood{font-size:18px}
  .food-stars{color:#fbbf24;font-size:13px;margin-top:2px}
  .food-detail{font-size:12px;color:var(--muted);margin-top:5px;line-height:1.5}
  .food-detail b{color:var(--pink-500)}
  .food-tags{display:flex;gap:5px;margin-top:6px;flex-wrap:wrap}
  .food-tag{font-size:10px;padding:2px 8px;border-radius:999px;font-weight:600}
  .food-tag.queue{background:#fef3c7;color:#b45309}
  .food-tag.price{background:var(--sky-100);color:var(--sky-600)}
  .add-mini{background:linear-gradient(135deg,var(--pink-300),var(--pink-500));color:#fff;border:none;border-radius:999px;padding:7px 14px;font-size:12px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:5px;box-shadow:0 6px 14px -6px rgba(236,72,153,.5);margin-bottom:10px}
  .add-mini:hover{transform:translateY(-1px)}

  /* 心愿 */
  .wish-item{background:#fff;border:2px solid var(--sky-100);border-radius:12px;padding:9px 12px;margin-bottom:6px;display:flex;align-items:center;gap:8px;transition:all .2s}
  .wish-item.checked{opacity:.5}
  .wish-item.checked .wish-text{text-decoration:line-through;color:var(--muted)}
  .wish-text{flex:1;font-size:13px;font-weight:600}
  .wish-del{border:none;background:transparent;color:var(--muted);cursor:pointer;font-size:14px;padding:2px 6px;border-radius:6px}
  .wish-del:hover{background:#fee2e2;color:#ef4444}

  /* 行李 */
  .pack-cat{margin-bottom:12px}
  .pack-cat-title{font-size:12px;font-weight:700;color:var(--sky-600);margin-bottom:5px;display:flex;align-items:center;gap:6px}
  .pack-cat-title .prog{font-size:10px;color:var(--muted);font-weight:500}
  .pack-item{display:flex;align-items:center;gap:7px;padding:5px 8px;border-radius:8px;cursor:pointer;transition:background .15s}
  .pack-item:hover{background:var(--sky-50)}
  .pack-item.checked .pack-text{text-decoration:line-through;color:var(--muted)}
  .pack-text{font-size:12px;flex:1}
  .pack-prog-bar{height:6px;background:var(--sky-100);border-radius:3px;overflow:hidden;margin:6px 0 10px}
  .pack-prog-fill{height:100%;background:linear-gradient(90deg,var(--sky-400),var(--mint-300));border-radius:3px;transition:width .4s ease}

  /* 模态框 */
  .modal-backdrop{position:fixed;inset:0;background:rgba(56,189,248,.25);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;z-index:2000;padding:20px}
  .modal-backdrop.show{display:flex;animation:fadeIn .25s ease}
  .modal{background:#fff;border-radius:26px;width:100%;max-width:440px;box-shadow:0 30px 60px -20px rgba(14,165,233,.5);border:4px solid #fff;overflow:hidden;animation:modalPop .45s cubic-bezier(.34,1.56,.64,1) both;max-height:92vh;display:flex;flex-direction:column}

function syncToServer(type) {
  fetch('/api/'+type, {method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(_cache[type])}).catch(()=>{});
}
function loadSpots(){return (_cache.spots||[]).map(s=>({timePeriod:'noon',checked:false,duration:0,order:0,transport:'',...s}))}
function saveSpots(s){_cache.spots=s;syncToServer('spots')}
function getFoods(){return _cache.foods||[]}
function saveFoods(f){_cache.foods=f;syncToServer('foods')}
function getWishes(){return _cache.wishes||[]}
function saveWishes(w){_cache.wishes=w;syncToServer('wishes')}

/* ==================== 地图 ==================== */
let map, addMode=false, pendingLatLng=null, editingId=null;
let selectedEmoji=EMOJIS[0], selectedDay=1, selectedTime='noon';
let activeFilter='all';
const markers={};
const polylines=[];

map=L.map('map',{center:HANGZHOU_CENTER,zoom:12,zoomControl:true,attributionControl:true});
L.tileLayer('https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}',{subdomains:'1234',maxZoom:18,attribution:'© 高德地图'}).addTo(map);

function makeIcon(emoji,day,checked){
  const info=dayInfo(day);
  const op=checked?.5:1;
  return L.divIcon({html:`<div class="cute-marker ${checked?'checked-marker':''}">
    <svg viewBox="0 0 38 46" width="36" height="44" xmlns="http://www.w3.org/2000/svg">
      <path d="M19 1C9.6 1 2 8.6 2 18c0 10.5 12.5 22.3 15.4 25.2a2 2 0 0 0 3.2 0C23.5 40.3 36 28.5 36 18 36 8.6 28.4 1 19 1z" fill="${info.color}" stroke="#fff" stroke-width="2" opacity="${op}"/>
      <circle cx="19" cy="16" r="11" fill="#fff" opacity="${op}"/>
      <text x="19" y="21" text-anchor="middle" font-size="14">${emoji}</text>
    </svg></div>`,className:'cute-marker-wrap',iconSize:[36,44],iconAnchor:[18,44],popupAnchor:[0,-40]});
}

function popupHtml(spot){
  const info=dayInfo(spot.day);
  const notes=spot.notes&&spot.notes.trim()?spot.notes:'还没有备注～';
  const ec=spot.notes&&spot.notes.trim()?'':'empty';
  const dayText=spot.day===0?'未安排':`Day ${spot.day}·${info.date}`;
  const dur=spot.duration?`⏱ ${spot.duration}分钟`:'';
  return `<div class="popup-head" style="background:linear-gradient(135deg,${info.light},${info.color})">
    <span class="emoji">${spot.emoji}</span><span class="name font-cute">${escapeHtml(spot.name)}</span><span class="day-tag">${dayText}</span></div>
    <div class="check-row"><div class="ti-check ${spot.checked?'checked':''}" data-id="${spot.id}"></div><span class="check-label">${spot.checked?'已打卡 ✓':'打卡完成？'}</span></div>
    <div class="popup-body"><div class="label">攻略备注</div><div class="notes ${ec}">${escapeHtml(notes)}</div>
    <div class="popup-meta">${dur}${spot.transport?`<span class="transport">🚇 ${escapeHtml(spot.transport)}</span>`:''}<span>📍 ${spot.lat.toFixed(3)},${spot.lng.toFixed(3)}</span></div></div>
    <div class="popup-actions"><button class="btn ghost" data-act="edit" data-id="${spot.id}">编辑</button><button class="btn danger" data-act="del" data-id="${spot.id}">删除</button></div>`;
}
function escapeHtml(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}

function renderAll(){
  Object.values(markers).forEach(m=>map.removeLayer(m));
  Object.keys(markers).forEach(k=>delete markers[k]);
  polylines.forEach(p=>map.removeLayer(p));
  polylines.length=0;

  let spots=loadSpots();
  if(activeFilter!=='all'){
    // 未安排(day=0)的景点默认在 Day1/2/3 都显示；选「未安排」时只看 day=0
    if(activeFilter==='0') spots=spots.filter(s=>s.day===0);
    else spots=spots.filter(s=>String(s.day)===activeFilter||s.day===0);
  }
  spots.forEach(s=>addMarkerToMap(s));
  drawRoutes(spots);
  updateCount();
  renderTimeline();
  document.getElementById('emptyState').classList.toggle('show',spots.length===0&&activeFilter==='all');
}

let popupCloseTimer=null;
function clearPopupTimer(){if(popupCloseTimer){clearTimeout(popupCloseTimer);popupCloseTimer=null}}
function schedulePopupClose(marker){clearPopupTimer();popupCloseTimer=setTimeout(()=>{if(marker)marker.closePopup()},280)}

function addMarkerToMap(spot){
  const m=L.marker([spot.lat,spot.lng],{icon:makeIcon(spot.emoji,spot.day,spot.checked)}).addTo(map);
  m.bindPopup(popupHtml(spot),{closeButton:true,autoPan:false,autoPanPadding:[40,40],maxWidth:280,offset:[0,-6]});
  // 悬停打开
  m.on('mouseover',()=>{clearPopupTimer();m.openPopup()});
  m.on('mouseout',()=>schedulePopupClose(m));
  m.on('popupopen',()=>{
    const wrap=document.querySelector('.leaflet-popup');if(!wrap)return;
    // 鼠标移入弹窗则保持打开，移出则延时关闭
    wrap.addEventListener('mouseenter',clearPopupTimer);
    wrap.addEventListener('mouseleave',()=>schedulePopupClose(m));
    const w=wrap.querySelector('.leaflet-popup-content');if(!w)return;
    w.querySelectorAll('.ti-check').forEach(c=>c.addEventListener('click',e=>{e.stopPropagation();toggleCheck(c.dataset.id)}));
    w.querySelectorAll('button[data-act]').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();const a=b.dataset.act,id=b.dataset.id;if(a==='edit')openEditModal(id);else if(a==='del')deleteSpot(id)}));
  });
  markers[spot.id]=m;
}

function drawRoutes(spots){
  [1,2,3].forEach(d=>{
    const daySpots=spots.filter(s=>s.day===d).sort((a,b)=>(a.order||0)-(b.order||0));
    if(daySpots.length<2)return;
    const info=dayInfo(d);
    const line=L.polyline(daySpots.map(s=>[s.lat,s.lng]),{
      color:info.color,weight:3,opacity:.55,dashArray:'8 8',lineCap:'round'
    }).addTo(map);
    polylines.push(line);
  });
}

function updateCount(){document.getElementById('countChip').textContent=`📍 ${loadSpots().length}`}

/* ==================== 打卡 ==================== */
function toggleCheck(id){
  const spots=loadSpots();
  const idx=spots.findIndex(s=>s.id===id);
  if(idx<0)return;
  spots[idx].checked=!spots[idx].checked;
  saveSpots(spots);
  if(spots[idx].checked)spawnConfetti();
  map.closePopup();
  renderAll();
  renderTimeline();
}
function spawnConfetti(){
  const emojis=['🎉','✨','💖','⭐','🎊'];
  for(let i=0;i<12;i++){
    const c=document.createElement('div');
    c.className='confetti';
    c.textContent=emojis[Math.floor(Math.random()*emojis.length)];
    c.style.left=(window.innerWidth/2+(Math.random()-.5)*300)+'px';
    c.style.top=(window.innerHeight/2+(Math.random()-.5)*100)+'px';
    c.style.animationDelay=(Math.random()*.3)+'s';
    document.body.appendChild(c);
    setTimeout(()=>c.remove(),1500);
  }
}

let searchTimer=null;
const searchInput=document.getElementById('searchInput');
const searchResults=document.getElementById('searchResults');
searchInput.addEventListener('input',()=>{clearTimeout(searchTimer);const q=searchInput.value.trim();if(!q){searchResults.classList.remove('show');searchResults.innerHTML='';return}searchTimer=setTimeout(()=>doSearch(q),200)});
document.getElementById('searchBtn').addEventListener('click',()=>{const q=searchInput.value.trim();if(q)doSearch(q)});
searchInput.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();const q=searchInput.value.trim();if(q)doSearch(q)}});
async function doSearch(q){
  searchResults.classList.add('show');
  searchResults.innerHTML=`<div class="search-result"><div class="sr-name">搜索中…</div><div class="sr-addr">正在查询高德地图 🔍</div></div>`;
  let results=[];
  try{
    const resp=await fetch(`/api/amap/search?keywords=${encodeURIComponent(q)}`);
    const data=await resp.json();
    if(data.pois&&data.pois.length)results=data.pois;
  }catch(e){/* fall through to local */}
  // 兜底：本地库
  if(!results.length){
    const lower=q.toLowerCase();
    results=HZ_PLACES.filter(p=>p.name.toLowerCase().includes(lower)||p.addr.toLowerCase().includes(lower)).slice(0,8);
  }
  if(!results.length){searchResults.innerHTML=`<div class="search-result"><div class="sr-name">未找到「${escapeHtml(q)}」</div><div class="sr-addr">换个关键词试试～</div></div>`;return}
  searchResults.innerHTML=results.map(p=>`<div class="search-result" data-lat="${p.lat}" data-lon="${p.lng}" data-name="${escapeHtml(p.name)}"><div class="sr-name">${escapeHtml(p.name)}</div><div class="sr-addr">${escapeHtml(p.addr)}</div></div>`).join('');
  searchResults.querySelectorAll('.search-result[data-lat]').forEach(el=>el.addEventListener('click',()=>{
    const lat=parseFloat(el.dataset.lat),lon=parseFloat(el.dataset.lon);
    pendingLatLng=L.latLng(lat,lon);editingId=null;
    map.flyTo([lat,lon],15,{duration:.8});
    searchResults.classList.remove('show');searchInput.value='';
    setTimeout(()=>openModal(el.dataset.name),600);
  }));
}

/* ==================== 时间轴面板 ==================== */
function renderTimeline(){
  const sec=document.getElementById('sec-timeline');
  const spots=loadSpots();
  const days=[1,2,3];
  let html='';
  days.forEach(d=>{
    // 未安排(day=0)的景点默认在每天都显示
    const daySpots=spots.filter(s=>s.day===d||s.day===0);
    if(!daySpots.length)return;
    const info=dayInfo(d);
    const title=`${info.label} · ${info.date}`;
    html+=`<div class="day-group"><div class="day-group-title" style="background:linear-gradient(135deg,${info.light},${info.color})">${title}</div>`;
    ['morning','noon','evening'].forEach(tp=>{
      const items=daySpots.filter(s=>s.timePeriod===tp).sort((a,b)=>(a.order||0)-(b.order||0));
      if(!items.length)return;
      html+=`<div class="time-block"><div class="time-block-title">${TIME_LABELS[tp]}</div>`;
      items.forEach(s=>{
        const unassignedTag=s.day===0?' <span style="font-size:10px;color:var(--muted);font-weight:500">(待定)</span>':'';
        html+=`<div class="timeline-item ${s.checked?'checked':''}" data-id="${s.id}">
          <div class="ti-check ${s.checked?'checked':''}" data-id="${s.id}"></div>
          <div class="ti-info"><div class="ti-name">${s.emoji} ${escapeHtml(s.name)}${unassignedTag}</div>
          <div class="ti-meta">${s.duration?`<span class="dur">⏱ ${s.duration}分钟</span>`:''}${s.transport?`<span class="trans">🚇 ${escapeHtml(s.transport)}</span>`:''}</div></div></div>`;
      });
      html+=`</div>`;
    });
    html+=`</div>`;
  });
  if(!html)html='<div style="text-align:center;color:var(--muted);padding:30px 0;font-size:13px">还没有安排行程～<br>去地图上添加景点吧 ✨</div>';
  sec.innerHTML=html;
  sec.querySelectorAll('.ti-check').forEach(c=>c.addEventListener('click',e=>{e.stopPropagation();toggleCheck(c.dataset.id)}));
  sec.querySelectorAll('.timeline-item').forEach(it=>it.addEventListener('click',e=>{if(e.target.classList.contains('ti-check'))return;const id=it.dataset.id;const s=loadSpots().find(x=>x.id===id);if(s&&markers[id])markers[id].openPopup()}));
}

/* ==================== 行李 ==================== */
const PACK_CAT_ICON={'证件':'🪪','衣物':'👗','洗漱护肤':'💄','电子设备':'📱','药品':'💊','其他':'☂️'};
function renderPacking(){
  const items=getPacking();
  const list=document.getElementById('packList');
  // 从数据动态分组
  const cats=[...new Set(items.map(i=>i.cat))];
  let html='';
  cats.forEach(c=>{
    const catItems=items.filter(i=>i.cat===c);
    const done=catItems.filter(i=>i.checked).length;
    const icon=PACK_CAT_ICON[c]||'📦';
    html+=`<div class="pack-cat"><div class="pack-cat-title">${icon} ${c} <span class="prog">${done}/${catItems.length}</span></div>`;
    catItems.forEach(it=>{html+=`<div class="pack-item ${it.checked?'checked':''}" data-id="${it.id}">
      <div class="ti-check ${it.checked?'checked':''}"></div>
      <span class="pack-text">${escapeHtml(it.text)}</span>
      <button class="wish-del" data-del="${it.id}">✕</button></div>`});
    html+=`</div>`;
  });
  if(!html)html='<div style="text-align:center;color:var(--muted);padding:20px 0;font-size:13px">添加第一件行李吧 🧳</div>';
  list.innerHTML=html;
  const total=items.length,checked=items.filter(i=>i.checked).length;
  const pct=total?Math.round(checked/total*100):0;
  document.getElementById('packCount').textContent=pct+'%';
  document.getElementById('packProg').style.width=pct+'%';
  list.querySelectorAll('.pack-item').forEach(it=>{
    it.onclick=e=>{
      const delBtn=e.target.closest('.wish-del');
      if(delBtn){
        savePacking(getPacking().filter(x=>x.id!==delBtn.dataset.del));
        renderPacking();return;
      }
      const arr=getPacking();const i=arr.findIndex(x=>x.id===it.dataset.id);
      if(i>=0){arr[i].checked=!arr[i].checked;savePacking(arr);renderPacking()}
    };
  });
}
document.getElementById('addPackBtn').onclick=addPackItem;
document.getElementById('packInput').addEventListener('keydown',e=>{if(e.key==='Enter')addPackItem()});
function addPackItem(){
  const inp=document.getElementById('packInput');
  const text=inp.value.trim();if(!text)return;
  const cat=document.getElementById('packCat').value;
  savePacking([...getPacking(),{id:'p'+Date.now()+Math.random().toString(36).slice(2,6),cat,text,checked:false}]);
  inp.value='';renderPacking();
}

/* ==================== 天气 ==================== */
const WMO={0:{desc:'晴',icon:'sunny'},1:{desc:'大部晴',icon:'partly'},2:{desc:'多云',icon:'partly'},3:{desc:'阴',icon:'cloudy'},45:{desc:'雾',icon:'fog'},51:{desc:'毛毛雨',icon:'drizzle'},53:{desc:'毛毛雨',icon:'drizzle'},61:{desc:'小雨',icon:'rain'},63:{desc:'中雨',icon:'rain'},65:{desc:'大雨',icon:'rain'},80:{desc:'阵雨',icon:'rain'},95:{desc:'雷暴',icon:'storm'},96:{desc:'雷暴',icon:'storm'}};
function wmoInfo(c){return WMO[c]||{desc:'未知',icon:'cloudy'}}
function weatherSvg(type){
  const rays=(cx,cy,r)=>[0,45,90,135,180,225,270,315].map(a=>`<line x1="${cx}" y1="${cy-r}" x2="${cx}" y2="${cy-r-6}" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" transform="rotate(${a} ${cx} ${cy})"/>`).join('');
  switch(type){
    case'sunny':return`<svg viewBox="0 0 64 64" width="40" height="40"><g class="wx-sun-rays">${rays(32,32,13)}</g><circle cx="32" cy="32" r="12" fill="#fbbf24"/></svg>`;
    case'partly':return`<svg viewBox="0 0 64 64" width="40" height="40"><g class="wx-sun-rays" style="transform-origin:24px 24px">${rays(24,24,9)}</g><circle cx="24" cy="24" r="8" fill="#fbbf24"/><g class="wx-cloud-1"><path d="M22 44 Q14 44 14 37 Q14 30 22 30 Q24 24 31 24 Q40 24 42 32 Q50 32 50 40 Q50 46 44 46 Z" fill="#cbd5e1"/></g></svg>`;
    case'cloudy':return`<svg viewBox="0 0 64 64" width="40" height="40"><g class="wx-cloud-1"><path d="M20 42 Q12 42 12 35 Q12 28 20 28 Q22 22 29 22 Q38 22 40 30 Q48 30 48 38 Q48 44 42 44 Z" fill="#cbd5e1"/></g><g class="wx-cloud-2" style="opacity:.7"><path d="M34 50 Q28 50 28 45 Q28 41 32 41 Q33 38 37 38 Q43 38 44 42 Q49 42 49 46 Q49 50 45 50 Z" fill="#e2e8f0"/></g></svg>`;
    case'fog':return`<svg viewBox="0 0 64 64" width="40" height="40"><path d="M16 24 Q10 24 10 20 Q10 16 15 16 Q17 11 24 11 Q33 11 35 18 Q43 18 43 24 Q43 28 38 28 Z" fill="#cbd5e1"/><g class="wx-cloud-1"><line x1="10" y1="38" x2="54" y2="38" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" opacity=".7"/><line x1="14" y1="46" x2="50" y2="46" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" opacity=".5"/></g></svg>`;
    case'drizzle':case'rain':return`<svg viewBox="0 0 64 64" width="40" height="40"><path d="M20 34 Q12 34 12 27 Q12 20 20 20 Q22 14 29 14 Q38 14 40 22 Q48 22 48 30 Q48 36 42 36 Z" fill="#94a3b8"/><line class="wx-drop" x1="20" y1="40" x2="17" y2="52" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" style="animation-delay:0s"/><line class="wx-drop" x1="30" y1="40" x2="27" y2="52" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" style="animation-delay:.3s"/><line class="wx-drop" x1="40" y1="40" x2="37" y2="52" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" style="animation-delay:.6s"/></svg>`;
    case'storm':return`<svg viewBox="0 0 64 64" width="40" height="40"><path d="M20 32 Q12 32 12 25 Q12 18 20 18 Q22 12 29 12 Q38 12 40 20 Q48 20 48 28 Q48 34 42 34 Z" fill="#64748b"/><polygon class="wx-bolt" points="30,36 24,50 30,50 26,60 40,44 33,44 38,36" fill="#fbbf24" stroke="#f59e0b" stroke-width="1"/></svg>`;
    default:return`<svg viewBox="0 0 64 64" width="40" height="40"><circle cx="32" cy="32" r="14" fill="#cbd5e1"/></svg>`;
  }
}
const FALLBACK=[{code:2,tmax:27,tmin:20,precip:30},{code:61,tmax:25,tmin:19,precip:60},{code:1,tmax:28,tmin:21,precip:20}];
async function loadWeather(){
  try{const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${HANGZHOU_CENTER[0]}&longitude=${HANGZHOU_CENTER[1]}&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Asia/Shanghai&forecast_days=16`);
  const d=await r.json();const daily=d?.daily;if(!daily)throw 0;
  TRIP_DATES.forEach((ds,i)=>{const idx=daily.time.indexOf(ds);const w=idx>=0?{code:daily.weather_code[idx],tmax:Math.round(daily.temperature_2m_max[idx]),tmin:Math.round(daily.temperature_2m_min[idx]),precip:daily.precipitation_probability_max[idx]??0}:FALLBACK[i];renderWx(i+1,w)})}
  catch(e){TRIP_DATES.forEach((_,i)=>renderWx(i+1,FALLBACK[i]))}
}
function renderWx(n,w){const i=wmoInfo(w.code);document.getElementById('wxIcon'+n).innerHTML=weatherSvg(i.icon);document.getElementById('wxDesc'+n).textContent=i.desc;document.getElementById('wxTemp'+n).innerHTML=`${w.tmax}°/<span class="lo">${w.tmin}°</span>`;document.getElementById('wxRain'+n).textContent=`💧${w.precip}%`}

/* ==================== 启动 ==================== */
(async function(){
  await initCache();
  renderAll();
  renderFoods();
  renderWishes();
  renderPacking();
  loadWeather();
})();
</script>
